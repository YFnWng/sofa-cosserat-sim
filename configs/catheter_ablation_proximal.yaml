rod:
  # Geometry — SI (metres).  SOFA's BeamHookeLawForceField treats all lengths
  # as metres when E is in Pa, so passing SI values keeps physics consistent.
  length: 125.0e-3       # m (total arc length)
  n_sections: 25
  n_frames: 25           # geometry.py appends tip → 32+1=33 total SOFA frames = n_sections+1
  beam_radius: 1.45e-3   # m (beam cross-section radius)
  kirchhoff: true
  # Physics
  mass: 0.03125             # kg
  young_modulus: 2.0e9   # Pa
  poisson_ratio: 0.38
  rayleigh_stiffness: 0.7   # Rayleigh stiffness damping (damps high-freq oscillations)
  rayleigh_mass: 1.0e-1     # Rayleigh mass damping (damps low-freq/rigid-body motion)
  strain_damping: 0.0       # Per-strain velocity damping (rod only, does not affect base). 0 = disabled
  # Variable stiffness — omit this block for uniform E/nu along the rod.
  # node_indices: section boundaries where properties change (ascending).
  # young_modulus / poisson_ratio: one value per segment, or length 1 for uniform.
  # Example: stiffer proximal half, softer distal half:
  # stiffness_sections:
  #   node_indices: [0, 25]
  #   young_modulus: [2.0e9, 2.0e8]
  #   poisson_ratio: [0.38]
  # Base pose — z = -length so the tip starts near the scene origin
  base_position: [0.0, 0.0, -160.0e-3]   # m
  base_orientation_euler_xyz_deg: [0.0, 0.0, 0.0]
  # Rotates the Cosserat prefab so its local-X rod axis aligns with scene local-Z
  prefab_rotation_euler_xyz_deg: [0.0, -90.0, 0.0]
  proximal_node_idx: 25
  # Base actuation — realistic insertion/rotation drive with deadzone (backlash)
  # + friction, replacing the old stiff K=1e10 RestShapeSpringsForceField.
  # Force law per actuated DOF: f = Kb*P(r-b) - Db*b_dot - F0*tanh(b_dot/v0),
  # P(e)=softplus(e-delta)-softplus(-e-delta).  Set enabled:false (or delta:0,
  # F0:0, Kb large) to recover the old stiff-spring behaviour.
  base_actuation:
    enabled: true
    # NOTE: the stiffness Kb*P' enters the implicit matrix (stable for stiff Kb),
    # but a Python ForceField's velocity terms (Db, friction) are applied
    # EXPLICITLY (SOFA gives bFactor=0), so keep Db modest and v0 not too sharp
    # for stability — implicit-Euler numerical dissipation damps the stiff mode.
    # The base is Rayleigh-free (solver β=0; rod damping is an explicit strain FF),
    # so its friction stays visible.  Velocity terms (Db, friction) are explicit
    # (a Python ForceField's velocity tangent doesn't enter the matrix), so keep
    # Db modest and v0 not too sharp for stability.
    insertion:  # SI: Kb [N/m], Db [N·s/m], F0 [N], v0 [m/s], delta [m], eps [1/m]
      Kb: 5.0e3
      Db: 2.0
      F0: 0.5
      v0: 5.0e-2         # friction smoothing speed (sharper -> chatter; explicit)
      delta: 2.0e-4      # ~0.2 mm backlash half-width
      eps: 2.0e4         # eps*delta ~ 4 → fairly sharp deadzone
    rotation:   # Kb [N·m/rad], Db [N·m·s/rad], F0 [N·m], v0 [rad/s], delta [rad], eps [1/rad]
      Kb: 2.0
      Db: 0.02
      F0: 0.02
      v0: 0.2
      delta: 0.0175      # ~1 deg backlash half-width
      eps: 200.0
    non_actuated:  # rigid carriage on DOFs orthogonal to the insertion axis
      K_perp: 1.0e6
      B_perp: 1.0e3
      K_tilt: 1.0e4
      B_tilt: 10.0

actuation:
  cable_mode: force   # displacement | force
  cable_locations:           # [x, y] coordinates (m) of each cable in the cross-section
    - [0.0, 1.4e-3]
  cable_point_count: 26      # number of guide points per cable
  # Keyboard controller
  insertion_direction: [0.0, 0.0, 1.0]  # unit vector in local frame
  insertion_speed: 30.0e-3   # m/s  (was 30 mm/s)
  max_travel: 80.0e-3       # m    (was 160 mm)
  rotation_speed: 30.0       # deg/s
  max_rotation: 180.0        # degrees

  displacement:
    pull_min: 0.0            # m
    pull_max: 30.0e-3        # m    (was 30 mm)
    pull_increment: 3.0e-3   # m/s  (was 3 mm/s)

  force:
    pull_min: 0.0            # N
    pull_max: 50.0           # N    (was 5 N with mm units)
    pull_increment: 3.0    # N/s

# Random tip force perturbation during data collection.
# Smooth band-limited force applied to the rod tip (sum of sinusoids).
# Set max_force to 0 to disable.
tip_force:
  max_force: 0.5             # N (peak magnitude per axis)
